# Category: Config
# File: nginx_sites_available_python
# Description: Nginx reverse proxy configuration for docker-python (Granian WSGI/ASGI).
# Usage: Symlink to /etc/nginx/sites-enabled/ and reload nginx.
# Maintainer: ryumada

# 1. CORS origin validation map
map $http_origin $cors_origin_header {
    default "";
    # Whitelisted frontend domain:
    # "~^https:\/\/app\.yourdomain\.com$" $http_origin;
    "" "";
}

# 2. HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name $DOMAIN;

    if ($host != "$DOMAIN") {
        return 403;
    }

    return 301 https://$host$request_uri;
}

# 3. Upstream Granian Python service
upstream $DOMAIN-python-backend {
    server 127.0.0.1:$GRANIAN_PORT; # e.g. 5000
    keepalive 32;
}

# 4. HTTPS Server block
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name $DOMAIN;

    if ($host != "$DOMAIN") {
        return 403;
    }

    # SSL certificates
    ssl_certificate         /etc/letsencrypt/live/$DOMAIN/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/$DOMAIN/privkey.pem;
    include                 /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam             /etc/letsencrypt/ssl-dhparams.pem;

    # Logging
    access_log              /var/log/nginx/python.$DOMAIN.access.log;
    error_log               /var/log/nginx/python.$DOMAIN.error.log;

    # Origin verification
    set $check_origin "0";
    if ($http_origin ~* .) {
        set $check_origin "1";
    }
    if ($cors_origin_header = "") {
        set $check_origin "${check_origin}1";
    }
    if ($check_origin = "11") {
        return 403;
    }

    # Proxy headers
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Timeouts & buffering
    proxy_http_version 1.1;
    proxy_connect_timeout 60s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffers 16 64k;
    proxy_buffer_size 128k;
    proxy_busy_buffers_size 256k;

    location / {
        limit_except GET POST PUT PATCH DELETE OPTIONS HEAD { deny all; }

        # WebSocket & streaming support for ASGI/FastAPI
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $http_connection;

        proxy_pass http://$DOMAIN-python-backend;
    }
}
